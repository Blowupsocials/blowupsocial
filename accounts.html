<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media Accounts – BlowUpSocials</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body { font-family: 'Inter', sans-serif; background: #f0f2f7; color: #1a1a2e; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; }

    .ac-topbar {
      background: #fff; height: 62px; display: flex; align-items: center;
      padding: 0 24px; gap: 14px; border-bottom: 1px solid #e8eaf0;
      position: sticky; top: 0; z-index: 100;
    }
    .ac-back { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; color: #6b7080; transition: color 0.15s; }
    .ac-back:hover { color: #7c3aed; }
    .ac-topbar-title { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 800; color: #1a1a2e; flex: 1; }
    .ac-wallet-chip { display: flex; align-items: center; gap: 7px; padding: 6px 12px; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px; font-size: 0.78rem; white-space: nowrap; }
    .ac-wallet-chip span { color: #6b7280; }
    .ac-wallet-chip strong { color: #7c3aed; font-weight: 700; }

    .ac-page { max-width: 1200px; margin: 0 auto; padding: 0 0 80px; }

    /* PAGE TABS */
    .ac-page-tabs { display: flex; border-bottom: 2px solid #e8eaf0; background: #fff; padding: 0 20px; }
    .ac-page-tab { padding: 12px 20px; font-size: 0.84rem; font-weight: 600; color: #8b8fa8; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
    .ac-page-tab.active { color: #7c3aed; border-bottom-color: #7c3aed; }

    /* TWO-DROPDOWN FILTER BAR */
    .ac-filter-bar {
      background: #fff; padding: 12px 20px; border-bottom: 1px solid #e8eaf0;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .ac-dd-wrap { position: relative; flex: 1; min-width: 0; }
    .ac-dd-trigger {
      display: flex; align-items: center; gap: 9px; padding: 10px 13px;
      background: #f8f9fc; border: 1.5px solid #e8eaf0; border-radius: 11px;
      font-size: 0.82rem; font-weight: 600; color: #1a1a2e; width: 100%;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; text-align: left;
    }
    .ac-dd-trigger:hover { border-color: #c4b5fd; background: #f5f3ff; }
    .ac-dd-trigger.open  { border-color: #7c3aed; background: #f5f3ff; }
    .ac-dd-sel-ico { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; flex-shrink: 0; }
    .ac-dd-sel-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ac-dd-chevron { color: #8b8fa8; font-size: 0.68rem; flex-shrink: 0; transition: transform 0.2s; }
    .ac-dd-trigger.open .ac-dd-chevron { transform: rotate(180deg); color: #7c3aed; }
    .ac-dd-menu {
      position: absolute; top: calc(100% + 5px); left: 0; width: max-content; min-width: 100%;
      max-width: min(320px, calc(100vw - 32px)); background: #fff;
      border: 1.5px solid #e8eaf0; border-radius: 13px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.10); z-index: 300;
      max-height: 300px; overflow-y: auto; padding: 6px;
    }
    .ac-dd-option {
      display: flex; align-items: center; gap: 9px; padding: 9px 11px;
      border-radius: 8px; cursor: pointer; font-size: 0.81rem; font-weight: 600;
      color: #1a1a2e; transition: background 0.1s;
    }
    .ac-dd-option:hover  { background: #f5f3ff; }
    .ac-dd-option.active { background: #ede9fe; color: #7c3aed; }
    .ac-dd-opt-ico { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; flex-shrink: 0; }
    .ac-dd-wrap.disabled { opacity: 0.45; pointer-events: none; }

    /* SEARCH INPUT */
    .ac-search-wrap { position: relative; flex: 1; min-width: 0; }
    .ac-search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8b8fa8; font-size: 0.78rem; pointer-events: none; }
    .ac-search-input {
      width: 100%; padding: 10px 12px 10px 34px;
      background: #f8f9fc; border: 1.5px solid #e8eaf0; border-radius: 11px;
      font-size: 0.82rem; font-family: inherit; color: #1a1a2e; outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .ac-search-input::placeholder { color: #aab0c0; }
    .ac-search-input:focus { border-color: #7c3aed; background: #f5f3ff; }

    /* LISTING AREA */
    .ac-listing-area { padding: 20px; }

    .ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .ac-card { background: #fff; border-radius: 16px; border: 1.5px solid #f0f2f6; padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.15s, box-shadow 0.15s; }
    .ac-card:hover { border-color: #c4b5fd; box-shadow: 0 4px 16px rgba(124,58,237,0.08); }
    .ac-card-top { display: flex; align-items: flex-start; gap: 12px; }
    .ac-card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .ac-card-plat-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .ac-card-title { font-size: 0.85rem; font-weight: 700; color: #1a1a2e; line-height: 1.35; }
    .ac-card-desc { font-size: 0.77rem; color: #6b7080; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ac-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .ac-card-price { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 800; color: #1a1a2e; }
    .ac-card-qty { font-size: 0.71rem; color: #8b8fa8; margin-top: 2px; }
    .ac-btn-buy { background: linear-gradient(135deg, #7c3aed, #ec4899); color: #fff; padding: 9px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; transition: opacity 0.15s; }
    .ac-btn-buy:hover { opacity: 0.88; }
    .ac-btn-buy:disabled { opacity: 0.4; cursor: not-allowed; }

    .ac-state { text-align: center; padding: 60px 20px; color: #8b8fa8; }
    .ac-state i { font-size: 2rem; margin-bottom: 14px; display: block; }
    .ac-state p { font-size: 0.88rem; line-height: 1.5; }

    /* MY ORDERS */
    .ac-orders-list { display: flex; flex-direction: column; gap: 12px; }
    .ac-order-card { background: #fff; border-radius: 14px; border: 1.5px solid #f0f2f6; padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
    .ac-order-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; }
    .ac-order-info { flex: 1; min-width: 0; }
    .ac-order-title { font-size: 0.85rem; font-weight: 700; color: #1a1a2e; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ac-order-meta { font-size: 0.72rem; color: #8b8fa8; }
    .ac-order-right { text-align: right; flex-shrink: 0; }
    .ac-order-price { font-family: 'Space Grotesk', sans-serif; font-size: 0.92rem; font-weight: 800; }
    .ac-status { display: inline-block; padding: 2px 9px; border-radius: 50px; font-size: 0.68rem; font-weight: 700; margin-top: 5px; }
    .st-pending  { background: #fffbeb; color: #92400e; }
    .st-complete { background: #f0fdf4; color: #166534; }
    .st-failed   { background: #fef2f2; color: #991b1b; }
    .ac-creds-btn { margin-top: 8px; background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; padding: 5px 12px; border-radius: 7px; font-size: 0.75rem; font-weight: 600; display: inline-block; }

    /* MODAL */
    .ac-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .ac-modal-overlay.show { opacity: 1; pointer-events: all; }
    .ac-modal { background: #fff; border-radius: 18px; width: min(480px, calc(100vw - 32px)); max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; }
    .ac-modal-overlay.show .ac-modal { transform: translateY(0); }
    .ac-modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0; margin-bottom: 18px; }
    .ac-modal-hdr h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 800; }
    .ac-modal-close { width: 30px; height: 30px; border-radius: 8px; background: #f5f6fa; color: #6b7080; display: flex; align-items: center; justify-content: center; border: none; font-size: 0.88rem; }
    .ac-modal-body { padding: 0 20px 20px; }
    .ac-confirm-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f2f6; font-size: 0.83rem; }
    .ac-confirm-row:last-of-type { border-bottom: none; }
    .ac-confirm-row .lbl { color: #6b7080; }
    .ac-confirm-row .val { font-weight: 700; color: #1a1a2e; text-align: right; }
    .ac-confirm-row .val.hi  { color: #7c3aed; font-size: 1rem; }
    .ac-confirm-row .val.red { color: #ef4444; }
    .ac-modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .ac-btn-cancel { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid #e5e7eb; background: #fff; font-size: 0.83rem; font-weight: 600; color: #6b7080; }
    .ac-btn-confirm { flex: 2; padding: 11px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #ec4899); color: #fff; font-size: 0.83rem; font-weight: 700; border: none; }
    .ac-btn-confirm:disabled { opacity: 0.45; cursor: not-allowed; }
    .ac-modal-error { background: #fef2f2; color: #991b1b; border-radius: 8px; padding: 10px 14px; font-size: 0.8rem; margin-top: 12px; display: none; }

    .ac-success-icon { width: 56px; height: 56px; border-radius: 50%; background: #f0fdf4; color: #16a34a; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 16px; }
    .ac-creds-box { background: #f9fafb; border-radius: 12px; border: 1px solid #e5e7eb; padding: 14px; margin-top: 10px; }
    .ac-creds-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f0f2f6; font-size: 0.81rem; }
    .ac-creds-row:last-child { border-bottom: none; }
    .ac-creds-key { color: #8b8fa8; min-width: 90px; font-size: 0.75rem; }
    .ac-creds-val { font-weight: 600; color: #1a1a2e; font-family: monospace; flex: 1; word-break: break-all; }
    .ac-copy-btn { background: none; color: #8b8fa8; font-size: 0.75rem; padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
    .ac-copy-btn:hover { background: #e5e7eb; }
    .ac-warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 14px; font-size: 0.78rem; color: #92400e; margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; }

    .ac-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); padding: 11px 22px; border-radius: 50px; font-size: 0.82rem; font-weight: 600; color: #fff; z-index: 9999; transition: transform 0.3s; pointer-events: none; white-space: nowrap; }
    .ac-toast.show { transform: translateX(-50%) translateY(0); }
    .ac-toast.success { background: #16a34a; }
    .ac-toast.error   { background: #ef4444; }

    @media (max-width: 640px) {
      .ac-listing-area { padding: 14px 12px; }
      .ac-grid { grid-template-columns: 1fr; }
      .ac-topbar { padding: 0 16px; gap: 10px; }
      .ac-filter-bar { padding: 10px 12px; flex-direction: column; gap: 8px; }
      .ac-dd-wrap, .ac-search-wrap { width: 100%; flex: unset; }
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>

  <div class="ac-topbar">
    <a href="dashboard.html" class="ac-back"><i class="fas fa-arrow-left"></i></a>
    <div class="ac-topbar-title">Social Media Accounts</div>
    <div class="ac-wallet-chip"><span>Balance:</span><strong id="topbar-balance">₦0</strong></div>
  </div>

  <div class="ac-page">
    <!-- PAGE TABS -->
    <div class="ac-page-tabs">
      <button class="ac-page-tab active" id="ptab-browse" onclick="showView('browse')">
        <i class="fas fa-store" style="margin-right:6px"></i>Browse
      </button>
      <button class="ac-page-tab" id="ptab-orders" onclick="showView('orders')">
        <i class="fas fa-bag-shopping" style="margin-right:6px"></i>My Purchases
      </button>
    </div>

    <!-- BROWSE VIEW -->
    <div id="view-browse">
      <!-- TWO-DROPDOWN FILTER -->
      <div class="ac-filter-bar">
        <!-- Dropdown 1: Platform -->
        <div class="ac-dd-wrap disabled" id="plat-dd-wrap">
          <button class="ac-dd-trigger" id="plat-trigger" onclick="toggleDD('plat')">
            <span class="ac-dd-sel-ico" id="plat-sel-ico" style="background:#ede9fe;color:#7c3aed"><i class="fa-solid fa-hashtag"></i></span>
            <span class="ac-dd-sel-label" id="plat-sel-label">Select Platform</span>
            <i class="fa-solid fa-chevron-down ac-dd-chevron"></i>
          </button>
          <div class="ac-dd-menu" id="plat-menu" style="display:none"></div>
        </div>
        <!-- Dropdown 2: Account type -->
        <div class="ac-dd-wrap disabled" id="type-dd-wrap">
          <button class="ac-dd-trigger" id="type-trigger" onclick="toggleDD('type')">
            <span class="ac-dd-sel-label" id="type-sel-label">Select Type</span>
            <i class="fa-solid fa-chevron-down ac-dd-chevron"></i>
          </button>
          <div class="ac-dd-menu" id="type-menu" style="display:none"></div>
        </div>
        <!-- Search -->
        <div class="ac-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="ac-search-input" id="listing-search" type="text" placeholder="Search accounts…" oninput="filterListings(this.value)" />
        </div>
      </div>

      <!-- LISTINGS -->
      <div class="ac-listing-area" id="listing-area">
        <div class="ac-state"><i class="fas fa-spinner fa-spin"></i><p>Loading store…</p></div>
      </div>
    </div>

    <!-- MY ORDERS VIEW -->
    <div id="view-orders" style="display:none">
      <div class="ac-listing-area">
        <div class="ac-orders-list" id="orders-list">
          <div class="ac-state"><i class="fas fa-spinner fa-spin"></i><p>Loading your purchases…</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BUY MODAL -->
  <div class="ac-modal-overlay" id="buy-modal">
    <div class="ac-modal">
      <div class="ac-modal-hdr">
        <h3><i class="fas fa-cart-shopping" style="color:#7c3aed;margin-right:8px"></i>Confirm Purchase</h3>
        <button class="ac-modal-close" onclick="closeBuyModal()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="ac-modal-body">
        <div class="ac-confirm-row"><span class="lbl">Product</span><span class="val" id="bm-name" style="max-width:58%">—</span></div>
        <div class="ac-confirm-row"><span class="lbl">Category</span><span class="val" id="bm-platform">—</span></div>
        <div class="ac-confirm-row"><span class="lbl">Your Balance</span><span class="val" id="bm-balance">—</span></div>
        <div class="ac-confirm-row"><span class="lbl">Cost</span><span class="val hi" id="bm-price">—</span></div>
        <div class="ac-confirm-row"><span class="lbl">Balance After</span><span class="val" id="bm-after">—</span></div>
        <div class="ac-modal-error" id="bm-error"></div>
        <div class="ac-modal-actions">
          <button class="ac-btn-cancel" onclick="closeBuyModal()">Cancel</button>
          <button class="ac-btn-confirm" id="bm-confirm-btn" onclick="confirmBuy()">Confirm Purchase</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CREDENTIALS MODAL -->
  <div class="ac-modal-overlay" id="creds-modal">
    <div class="ac-modal">
      <div class="ac-modal-hdr">
        <h3>Purchase Complete</h3>
        <button class="ac-modal-close" onclick="document.getElementById('creds-modal').classList.remove('show')"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="ac-modal-body">
        <div class="ac-success-icon"><i class="fas fa-check"></i></div>
        <div id="creds-content"></div>
        <div class="ac-warn-box" id="creds-warn" style="display:none">
          <i class="fas fa-triangle-exclamation"></i>
          <span>Save these credentials now. Change the password after your first login.</span>
        </div>
        <button class="ac-btn-confirm" style="width:100%;margin-top:18px"
          onclick="document.getElementById('creds-modal').classList.remove('show')">Done</button>
      </div>
    </div>
  </div>

  <div class="ac-toast" id="ac-toast"></div>

  <script>
    const MARKUP     = 2;
    const USD_TO_NGN = 1600;
    const fmtNGN = v => `₦${Math.round(v * USD_TO_NGN).toLocaleString('en-NG')}`;

    let userBalance   = 0;
    let userId        = null;
    let selectedOffer = null;

    /* ── GROUPS: AccsZone social media accounts only ── */
    const GROUPS = [
      {
        label: 'Social Media', icon: 'fa-solid fa-hashtag',
        catIds: [22,24,95,75,38,34,40,23,50,37,81,76,33,97,90,92,66,98,67,114,110,80]
      },
    ];

    /* ── ICON MAP keyed by AccsZone category id ── */
    const CAT_ICON = {
      22:  { icon:'fa-brands fa-facebook',      color:'#1877F2', bg:'#eff6ff' },
      24:  { icon:'fa-brands fa-instagram',      color:'#E1306C', bg:'#fdf2f8' },
      95:  { icon:'fa-brands fa-threads',        color:'#000',    bg:'#f3f4f6' },
      75:  { icon:'fa-brands fa-youtube',        color:'#FF0000', bg:'#fef2f2' },
      38:  { icon:'fa-brands fa-x-twitter',      color:'#000',    bg:'#f9fafb' },
      34:  { icon:'fa-brands fa-tiktok',         color:'#000',    bg:'#f3f4f6' },
      40:  { icon:'fa-brands fa-telegram',       color:'#2AABEE', bg:'#f0f9ff' },
      23:  { icon:'fa-brands fa-linkedin',       color:'#0A66C2', bg:'#eff6ff' },
      50:  { icon:'fa-brands fa-discord',        color:'#5865F2', bg:'#f5f3ff' },
      37:  { icon:'fa-brands fa-snapchat',       color:'#FFCA28', bg:'#fefce8' },

      76:  { icon:'fa-brands fa-quora',          color:'#B92B27', bg:'#fef2f2' },
      33:  { icon:'fa-brands fa-reddit',         color:'#FF4500', bg:'#fff7ed' },
      97:  { icon:'fa-brands fa-twitch',         color:'#9146FF', bg:'#f5f3ff' },
      90:  { icon:'fa-solid fa-cloud',           color:'#0085FF', bg:'#eff6ff' },
      92:  { icon:'fa-solid fa-comment-dots',    color:'#5C5C99', bg:'#eff6ff' },
      66:  { icon:'fa-solid fa-star',            color:'#00B67A', bg:'#f0fdf4' },
      98:  { icon:'fa-brands fa-yelp',           color:'#D32323', bg:'#fef2f2' },
      67:  { icon:'fa-brands fa-whatsapp',       color:'#25D366', bg:'#f0fdf4' },
      114: { icon:'fa-brands fa-odnoklassniki',  color:'#ed812b', bg:'#fff7ed' },
      110: { icon:'fa-solid fa-robot',           color:'#7c3aed', bg:'#f5f3ff' },
      80:  { icon:'fa-brands fa-google',         color:'#4285F4', bg:'#eff6ff' },
      // Email
      21:  { icon:'fa-solid fa-envelope',        color:'#EA4335', bg:'#fef2f2' },
      26:  { icon:'fa-solid fa-phone',           color:'#4285F4', bg:'#eff6ff' },
      84:  { icon:'fa-brands fa-yahoo',          color:'#6001D2', bg:'#f5f3ff' },
      28:  { icon:'fa-solid fa-envelope',        color:'#0078D4', bg:'#eff6ff' },
      79:  { icon:'fa-solid fa-lock',            color:'#6D4AFF', bg:'#f5f3ff' },
      35:  { icon:'fa-solid fa-envelope',        color:'#1c5fa8', bg:'#eff6ff' },
      99:  { icon:'fa-solid fa-envelope',        color:'#005FF9', bg:'#eff6ff' },
      86:  { icon:'fa-solid fa-envelope',        color:'#E50000', bg:'#fef2f2' },
      85:  { icon:'fa-solid fa-envelope',        color:'#ff0b00', bg:'#fef2f2' },
      101: { icon:'fa-solid fa-envelope',        color:'#c00',    bg:'#fef2f2' },
      100: { icon:'fa-solid fa-envelope',        color:'#FC3F1D', bg:'#fff7ed' },

    function iconFor(catId, title) {
      if (catId && CAT_ICON[Number(catId)]) return CAT_ICON[Number(catId)];
      // title-based fallback
      const t = (title || '').toLowerCase();
      if (t.includes('instagram'))   return CAT_ICON[24];
      if (t.includes('facebook'))    return CAT_ICON[22];
      if (t.includes('tiktok'))      return CAT_ICON[34];
      if (t.includes('youtube'))     return CAT_ICON[75];
      if (t.includes('twitter') || t.includes('x-twitter')) return CAT_ICON[38];
      if (t.includes('telegram'))    return CAT_ICON[40];
      if (t.includes('snapchat'))    return CAT_ICON[37];
      if (t.includes('netflix'))     return CAT_ICON[69];
      if (t.includes('spotify'))     return CAT_ICON[107];
      if (t.includes('vpn'))         return CAT_ICON[59];
      if (t.includes('gmail'))       return CAT_ICON[21];
      if (t.includes('apple'))       return CAT_ICON[65];
      if (t.includes('amazon'))      return CAT_ICON[71];
      if (t.includes('steam'))       return CAT_ICON[70];
      return FALLBACK_ICON;
    }

    /* ── API ── */
    async function api(payload) {
      const r = await fetch('/api/accsmaster', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      return r.json();
    }

    function unwrap(res) {
      if (!res || res.error) return null;
      if (res.success === true || res.success === false) return res.data ?? null;
      return res;
    }

    /* ── VIEW SWITCH ── */
    function showView(tab) {
      document.getElementById('view-browse').style.display  = tab === 'browse' ? '' : 'none';
      document.getElementById('view-orders').style.display  = tab === 'orders' ? '' : 'none';
      document.getElementById('ptab-browse').className = 'ac-page-tab' + (tab === 'browse' ? ' active' : '');

    const SOCIAL_CAT_IDS = new Set([22,24,95,75,38,34,40,23,50,37,81,76,33,97,90,92,66,98,67,114,110,80]);

    /* ── TWO-DROPDOWN UI ── */
    function buildUI() {
      const platCats = allCategories
        .filter(c => SOCIAL_CAT_IDS.has(Number(c.id)))
        .sort((a, b) => {
          const ia = CAT_ORDER.indexOf(Number(a.id));
          const ib = CAT_ORDER.indexOf(Number(b.id));
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        });

      if (!platCats.length) {
        setListingState('<i class="fas fa-box-open"></i><p>No categories found.</p>'); return;
      }

      const platMenu = document.getElementById('plat-menu');
      platMenu.innerHTML = '';
      platCats.forEach(cat => {
        const name = cat.title || cat.name || String(cat.id);
        const ico  = CAT_ICON[Number(cat.id)] || FALLBACK_ICON;
        const opt  = document.createElement('div');
        opt.className = 'ac-dd-option';
        opt.innerHTML = `<div class="ac-dd-opt-ico" style="background:${ico.bg};color:${ico.color}"><i class="${ico.icon}"></i></div>${esc(name)}`;
        opt.onclick = () => selectPlatform(cat, ico, opt);
        platMenu.appendChild(opt);
      });

      document.getElementById('plat-dd-wrap').classList.remove('disabled');
      selectPlatform(platCats[0], CAT_ICON[Number(platCats[0].id)] || FALLBACK_ICON, platMenu.firstChild);
    }

    async function selectPlatform(cat, ico, optEl) {
      document.querySelectorAll('#plat-menu .ac-dd-option').forEach(o => o.classList.remove('active'));
      optEl.classList.add('active');

      const name = cat.title || cat.name || String(cat.id);
      const selIco = document.getElementById('plat-sel-ico');
      selIco.style.background = ico.bg;
      selIco.style.color      = ico.color;
      selIco.innerHTML        = `<i class="${ico.icon}"></i>`;
      document.getElementById('plat-sel-label').textContent = name;
      closeDD('plat');

      // Reset type dropdown while loading
      const typeWrap = document.getElementById('type-dd-wrap');
      const typeMenu = document.getElementById('type-menu');
      typeWrap.classList.add('disabled');
      document.getElementById('type-sel-label').textContent = 'Loading…';
      typeMenu.innerHTML = '';
      setListingState('<i class="fas fa-spinner fa-spin"></i><p>Loading…</p>');

      // Fetch subcategories from AccsZone
      const res  = await api({ action: 'subcategories', id: cat.id });
      const data = unwrap(res);
      const subs = Array.isArray(data) ? data : (data?.subcategories || data?.data || data?.items || data?.categories || []);

      if (!subs.length) {
        // No subcategories — load listings directly
        typeWrap.classList.add('disabled');
        document.getElementById('type-sel-label').textContent = 'All types';
        loadListings(cat.id);
        return;
      }

      subs.forEach((sub, i) => {
        const subName = sub.title || sub.name || String(sub.id);
        const opt = document.createElement('div');
        opt.className = 'ac-dd-option' + (i === 0 ? ' active' : '');
        opt.textContent = subName;
        opt.onclick = () => selectType(sub, subName, opt);
        typeMenu.appendChild(opt);
      });

      typeWrap.classList.remove('disabled');
      const first     = subs[0];
      const firstName = first.title || first.name || String(first.id);
      document.getElementById('type-sel-label').textContent = firstName;
      loadListings(first.id, true);
    }

    function selectType(sub, name, optEl) {
      document.querySelectorAll('#type-menu .ac-dd-option').forEach(o => o.classList.remove('active'));
      optEl.classList.add('active');
      document.getElementById('type-sel-label').textContent = name;
      closeDD('type');
      loadListings(sub.id, true);
    }

    function toggleDD(which) {
      const menu    = document.getElementById(`${which}-menu`);
      const trigger = document.getElementById(`${which}-trigger`);
      const isOpen  = menu.style.display !== 'none';
      const other   = which === 'plat' ? 'type' : 'plat';
      closeDD(other);
      menu.style.display = isOpen ? 'none' : 'block';
      trigger.classList.toggle('open', !isOpen);
    }

    function closeDD(which) {
      document.getElementById(`${which}-menu`).style.display = 'none';
      document.getElementById(`${which}-trigger`).classList.remove('open');

      ['plat', 'type'].forEach(which => {
        const wrap = document.getElementById(`${which}-dd-wrap`);
        if (wrap && !wrap.contains(e.target)) closeDD(which);
      });
    });

    /* ── SEARCH FILTER ── */
    function filterListings(query) {
      const q = query.trim().toLowerCase();
      const cards = document.querySelectorAll('#listing-area .ac-card');
      let visible = 0;
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        const show = !q || text.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      // Show/hide empty state
      let empty = document.getElementById('listing-empty');
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'listing-empty';
        empty.className = 'ac-state';
        empty.innerHTML = '<i class="fas fa-magnifying-glass"></i><p>No accounts match your search.</p>';
        document.getElementById('listing-area').appendChild(empty);
      }
      empty.style.display = (cards.length && !visible) ? 'block' : 'none';
    }

    /* ── LOAD LISTINGS ── */
    async function loadListings(id, useSubcat = false) {
      document.getElementById('listing-search').value = '';
      setListingState('<i class="fas fa-spinner fa-spin"></i><p>Loading…</p>');

      const queryParam = useSubcat ? { subcategory_id: id } : { category_id: id };
      let res = await api({ action: 'listings', ...queryParam });

      if (res.error === 'accounts_not_configured') {
        setListingState('<i class="fas fa-gear"></i><p>Store not configured.</p>'); return;
      }

      let data     = unwrap(res);
      let listings = Array.isArray(data) ? data : (data?.listings || data?.items || data?.results || []);

      // If subcategory_id returned nothing, retry with category_id and vice versa
      if (!listings.length && !res.error) {
        const retryParam = useSubcat ? { category_id: id } : { subcategory_id: id };
        const res2 = await api({ action: 'listings', ...retryParam });
        if (!res2.error) {
          const data2 = unwrap(res2);
          listings = Array.isArray(data2) ? data2 : (data2?.listings || data2?.items || data2?.results || []);
        }
      }

      if (res.error) {
        setListingState('<i class="fas fa-triangle-exclamation"></i><p>Could not load listings. Try again.</p>'); return;
      }

      renderListings(listings, id);
    }

    function setListingState(html) {
      document.getElementById('listing-area').innerHTML = `<div class="ac-state">${html}</div>`;
    }

    /* ── RENDER LISTINGS ── */
    function renderListings(listings, catId) {
      const area = document.getElementById('listing-area');
      if (!listings || !listings.length) {
        area.innerHTML = `<div class="ac-state"><i class="fas fa-box-open"></i><p>No products in this category right now.<br>Check back soon.</p></div>`;
        return;
      }

      area.innerHTML = `<div class="ac-grid">${listings.map(o => {
        const title    = o.title || o.name || `Product #${o.id}`;
        const catName  = o.category_name || o.category || o.type || '';
        const priceUsd = parseFloat(o.price || o.rate || o.cost || 0);
        const sellUsd  = priceUsd * MARKUP;
        const qty      = parseInt(o.quantity || o.stock || o.count || o.available || 0);
        const desc     = o.description || o.desc || o.details || '';
        const slug     = o.slug || o.id;
        const ico      = iconFromTitle(title, catId);
        const offerObj = JSON.stringify({ id: o.id, slug, title, catId, catName, priceUsd, sellUsd });

        return `<div class="ac-card">
          <div class="ac-card-top">
            <div class="ac-card-icon" style="background:${ico.bg};color:${ico.color}">
              <i class="${ico.icon}"></i>
            </div>
            <div style="flex:1;min-width:0">
              <div class="ac-card-plat-label" style="color:${ico.color}">${esc(catName || 'Social Media Account')}</div>
              <div class="ac-card-title">${esc(title)}</div>
            </div>
          </div>
          ${desc ? `<div class="ac-card-desc">${esc(desc)}</div>` : ''}
          <div class="ac-card-foot">
            <div>
              <div class="ac-card-price">${fmtNGN(sellUsd)}</div>
              <div class="ac-card-qty">${qty > 0 ? qty + ' in stock' : 'In stock'}</div>
            </div>
            <button class="ac-btn-buy" onclick='openBuyModal(${esc(offerObj)})'>Buy Now</button>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ── BUY MODAL ── */
    function openBuyModal(offer) {
      if (typeof offer === 'string') offer = JSON.parse(offer);
      selectedOffer = offer;
      const notEnough = userBalance < offer.sellUsd;
      const ico = CAT_ICON[Number(offer.catId)] || FALLBACK_ICON;

      document.getElementById('bm-name').textContent     = offer.title;
      document.getElementById('bm-platform').textContent = offer.catName || 'Social Media Account';
      document.getElementById('bm-balance').textContent  = fmtNGN(userBalance);
      document.getElementById('bm-price').textContent    = fmtNGN(offer.sellUsd);

      const afterEl = document.getElementById('bm-after');
      afterEl.textContent = fmtNGN(Math.max(0, userBalance - offer.sellUsd));
      afterEl.className   = 'val' + (notEnough ? ' red' : '');

      const errEl = document.getElementById('bm-error');
      errEl.style.display = notEnough ? 'block' : 'none';
      if (notEnough) errEl.textContent = 'Insufficient balance. Please add funds first.';

      document.getElementById('bm-confirm-btn').disabled = notEnough;
      document.getElementById('buy-modal').classList.add('show');
    }

    function closeBuyModal() {
      document.getElementById('buy-modal').classList.remove('show');
      selectedOffer = null;
    }

    /* ── CONFIRM PURCHASE ── */
    async function confirmBuy() {
      if (!selectedOffer) return;
      const btn   = document.getElementById('bm-confirm-btn');
      const errEl = document.getElementById('bm-error');
      btn.disabled = true;
      btn.textContent = 'Processing…';
      errEl.style.display = 'none';

      try {
        const res  = await api({ action: 'purchase', listing_id: selectedOffer.id, slug: selectedOffer.slug, quantity: 1 });
        const data = unwrap(res);
        if (!res || res.success === false) throw new Error(res.message || 'Purchase failed');

        const orderId     = data?.order_id || data?.id || null;
        const credentials = data?.credentials || data?.account || data?.accounts?.[0] || null;
        const newBalance  = userBalance - selectedOffer.sellUsd;

        await db.from('profiles').update({ wallet_balance: newBalance }).eq('id', userId);
        await db.from('account_orders').insert({
          user_id:           userId,
          provider_order_id: String(orderId || ''),
          offer_id:          String(selectedOffer.id || ''),
          offer_title:       selectedOffer.title,
          platform:          selectedOffer.catName || 'Social Media Account',
          price_usd:         selectedOffer.sellUsd,
          price_ngn:         Math.round(selectedOffer.sellUsd * USD_TO_NGN),
          status:            credentials ? 'complete' : 'pending',
          credentials:       credentials || null,
        });

        userBalance = newBalance;
        document.getElementById('topbar-balance').textContent = fmtNGN(newBalance);
        closeBuyModal();
        showCredentials(selectedOffer, credentials, orderId);

      } catch (e) {
        errEl.textContent   = 'Purchase could not be completed. Please try again.';
        errEl.style.display = 'block';
        btn.disabled    = false;
        btn.textContent = 'Confirm Purchase';
      }
    }

    /* ── CREDENTIALS MODAL ── */
    function showCredentials(offer, credentials, orderId) {
      const content = document.getElementById('creds-content');
      const warn    = document.getElementById('creds-warn');

      if (credentials && typeof credentials === 'object' && Object.keys(credentials).length) {
        const rows = Object.entries(credentials).map(([k, v]) =>
          `<div class="ac-creds-row">
            <span class="ac-creds-key">${esc(k)}</span>
            <span class="ac-creds-val" id="cv-${esc(k)}">${esc(String(v))}</span>
            <button class="ac-copy-btn" onclick="copyText('cv-${esc(k)}')"><i class="fas fa-copy"></i></button>
          </div>`
        ).join('');
        content.innerHTML = `<p style="text-align:center;font-size:0.83rem;color:#6b7080;margin-bottom:10px">Your access details for <strong>${esc(offer.title)}</strong></p><div class="ac-creds-box">${rows}</div>`;
        warn.style.display = 'flex';
      } else if (typeof credentials === 'string' && credentials.trim()) {
        content.innerHTML = `<div class="ac-creds-box"><pre style="font-size:0.8rem;white-space:pre-wrap;word-break:break-all">${esc(credentials)}</pre></div>`;
        warn.style.display = 'flex';
      } else {
        content.innerHTML = `
          <p style="text-align:center;font-size:0.9rem;font-weight:700;margin-bottom:8px">Order Placed!</p>
          <p style="text-align:center;font-size:0.83rem;color:#6b7080;line-height:1.55">
            Your product is being prepared. Check <strong>My Purchases</strong> for credentials once ready.
            ${orderId ? `<br><br>Reference: <strong>BUS-${esc(String(orderId))}</strong>` : ''}
          </p>`;
        warn.style.display = 'none';
      }
      document.getElementById('creds-modal').classList.add('show');
    }

    function copyText(id) {
      const val = document.getElementById(id)?.textContent || '';
      navigator.clipboard.writeText(val).then(() => toast('Copied!', 'success'));

        list.innerHTML = `<div class="ac-state"><i class="fas fa-bag-shopping"></i><p>No purchases yet.<br>Browse the store to get started.</p></div>`;
        return;

      list.innerHTML = orders.map(o => {
        const ico     = iconFor(null, o.platform || o.offer_title);
        const date    = new Date(o.created_at).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' });
        const stClass = { pending:'st-pending', complete:'st-complete', failed:'st-failed' }[o.status] || 'st-pending';
        const stLabel = { pending:'Processing', complete:'Delivered', failed:'Failed' }[o.status] || 'Pending';
        const credsBtn = (o.status === 'complete' && o.credentials)
          ? `<button class="ac-creds-btn" onclick='showStoredCreds(${esc(JSON.stringify({ title: o.offer_title, credentials: o.credentials }))})'>
               <i class="fas fa-key"></i> View Credentials
             </button>`
          : '';
        return `<div class="ac-order-card">
          <div class="ac-order-icon" style="background:${ico.bg};color:${ico.color}"><i class="${ico.icon}"></i></div>
          <div class="ac-order-info">
            <div class="ac-order-title">${esc(o.offer_title || 'Product Order')}</div>
            <div class="ac-order-meta">${esc(o.platform || '')} · ${date}</div>
            ${credsBtn}
          </div>
          <div class="ac-order-right">
            <div class="ac-order-price">₦${(o.price_ngn || 0).toLocaleString('en-NG')}</div>
            <span class="ac-status ${stClass}">${stLabel}</span>
          </div>
        </div>`;
      }).join('');
    }

    function showStoredCreds(data) {
      if (typeof data === 'string') data = JSON.parse(data);
      showCredentials({ title: data.title }, data.credentials, null);
    }

    function iconFor(catId, title) {
      if (catId && CAT_ICON[Number(catId)]) return CAT_ICON[Number(catId)];
      const t = (title || '').toLowerCase();
      const match = Object.entries(CAT_ICON).find(([id]) => {
        const cat = allCategories.find(c => Number(c.id) === Number(id));
        return cat && t.includes((cat.title || '').toLowerCase().split(' ')[0].toLowerCase());
      });
      return match ? match[1] : FALLBACK_ICON;
    }

    /* ── TOAST ── */
    function toast(msg, type = 'success') {
      const el = document.getElementById('ac-toast');
      el.textContent = msg;
      el.className = `ac-toast ${type} show`;
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    /* ── INIT ── */
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      userId = session.user.id;
      const { data: profile } = await db.from('profiles').select('wallet_balance').eq('id', userId).single();
      userBalance = parseFloat(profile?.wallet_balance || 0);
      document.getElementById('topbar-balance').textContent = fmtNGN(userBalance);

      // Load categories then build UI
      const res = await api({ action: 'categories' });
      if (res.error === 'accounts_not_configured') {
        setListingState('<i class="fas fa-gear"></i><p>Store not configured yet.</p>'); return;
      }
      const data = unwrap(res);
      allCategories = Array.isArray(data) ? data : (data?.categories || data?.items || []);

      buildUI();
    })();
  </script>
</body>
</html>
