name: Process Email Queue

on:
  schedule:
    - cron: '5 * * * *'   # every hour at :05
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email queue
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://blowupsocials.net/api/process-email-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
