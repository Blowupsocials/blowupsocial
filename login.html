<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – BlowUpSocial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img src="img/logo.jpg" alt="BlowUpSocial" class="logo-img" />
      </a>
      <div style="flex:1"></div>
      <div class="nav-right">
        <span style="font-size:0.82rem;color:var(--text-muted);">No account?</span>
        <a href="register.html" class="btn-neon">Get Started Free</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">

      <a href="index.html" class="logo"><img src="img/logo.jpg" alt="BlowUpSocial" class="logo-img" /></a>

      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to your account to continue</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-input-wrap">
            <input class="form-input" type="password" id="password" placeholder="Enter your password" required />
            <i class="fas fa-eye input-icon" id="togglePwd" onclick="togglePassword('password','togglePwd')"></i>
          </div>
        </div>

        <div class="form-footer-row">
          <label class="remember-row">
            <input type="checkbox" /> Remember me
          </label>
          <a href="forgot.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-auth">Sign In</button>
      </form>

      <div class="auth-divider">or continue with</div>

      <button class="btn-social" onclick="void(0)">
        <i class="fab fa-google" style="color:#ea4335"></i> Continue with Google
      </button>
      <button class="btn-social" onclick="void(0)">
        <i class="fab fa-facebook-f" style="color:#1877f2"></i> Continue with Facebook
      </button>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one free</a></p>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script>
    const ADMIN_EMAIL = 'blowupsocialsconsult@gmail.com';
    function redirectAfterLogin(email) {
      window.location.href = (email || '').toLowerCase() === ADMIN_EMAIL ? 'admin.html' : 'dashboard.html';
    }

    // Redirect already-logged-in users
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) redirectAfterLogin(session.user.email);
    });

    function togglePassword(id, iconId) {
      const input = document.getElementById(id);
      const icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showError(msg) {
      let el = document.getElementById('auth-error');
      if (!el) {
        el = document.createElement('div');
        el.id = 'auth-error';
        el.style.cssText = 'background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.25);color:#ef4444;padding:11px 14px;border-radius:9px;font-size:.82rem;margin-bottom:16px;text-align:center;';
        document.getElementById('loginForm').prepend(el);
      }
      el.textContent = msg;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn   = e.target.querySelector('.btn-auth');
      const email = document.getElementById('email').value.trim();
      const pwd   = document.getElementById('password').value;

      btn.textContent = 'Signing in…';
      btn.disabled = true;

      await db.auth.signOut();
      const { data, error } = await db.auth.signInWithPassword({ email, password: pwd });

      if (error) {
        btn.textContent = 'Sign In';
        btn.disabled = false;
        showError(error.message);
        return;
      }

      redirectAfterLogin(data.session.user.email);
    }
  </script>
</body>
</html>
